services:
  - type: web
    name: baitappython-web
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn housing_project.wsgi:application"
    plan: free
    branch: nguyen_day14
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: baitappython-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: baitappython-redis
          property: connectionString

  - type: redis
    name: baitappython-redis
    plan: free
    ipAllowList: [] # Chỉ cho phép kết nối nội bộ trong Render

databases:
  - name: baitappython-db
    databaseName: housing_db
    user: postgres
    plan: free
