name: Django CI/CD Pipeline

on:
  push:
    branches: [ "master", "main", "thanh_day14" ]
  pull_request:
    branches: [ "master", "main", "thanh_day14" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: clinicdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r clinic_management/requirements.txt

    - name: Run Django Tests
      env:
        DJANGO_SETTINGS_MODULE: clinic_management.settings.development
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_NAME: clinicdb
        DB_USER: postgres
        DB_PASSWORD: 123456
        REDIS_URL: redis://127.0.0.1:6379/1
      run: |
        cd clinic_management
        python manage.py test

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/thanh_day14'

    steps:
    - name: Trigger Render Deployment
      if: env.RENDER_DEPLOY_HOOK_URL != ''
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        echo "Kích hoạt quá trình Deploy tự động trên Render..."
        curl -X GET "$RENDER_DEPLOY_HOOK_URL"
        echo -e "\nĐã gửi lệnh Deploy tới Render thành công!"
