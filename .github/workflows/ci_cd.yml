name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # === BƯỚC 1: CONTINUOUS INTEGRATION (KIỂM THỬ TỰ ĐỘNG) ===
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    # Thiết lập biến môi trường ảo cho quá trình test
    env:
      DJANGO_ENV: development
      DJANGO_SECRET_KEY: test-secret-key-123
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip' # Tự động cache các thư viện để chạy nhanh hơn ở lần sau

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests with Coverage
      run: |
        coverage run manage.py test properties
        coverage report -m

  # === BƯỚC 2: CONTINUOUS DEPLOYMENT (TRIỂN KHAI LÊN SERVER) ===
  deploy:
    name: Deploy to Production
    needs: test # Bắt buộc phải pass qua bước "test" ở trên mới được deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' # Chỉ deploy khi code được merge vào nhánh chính

    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /path/to/your/server/BaiTapPython
          # Pull code mới nhất từ GitHub
          git pull origin main
          
          # Tải lại file cấu hình biến môi trường (nếu cần)
          # source .env
          
          # Build lại image nếu có thay đổi trong thư viện
          docker-compose up --build -d web
          
          # Chạy tự động migrate database
          docker-compose exec -T web python manage.py migrate --noinput
          
          # Xóa các file tĩnh cũ và gom lại file tĩnh mới (nếu dự án có cấu hình static files)
          # docker-compose exec -T web python manage.py collectstatic --noinput
